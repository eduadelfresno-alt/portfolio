<!DOCTYPE html>
<html lang="es">
<head>

  <title>Portafolio de Fotografía | Bilbao</title>
  <style>
    /* Estilos globales y reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #111111;
      color: #f5f5f5;
      line-height: 1.6;
    }

    /* Encabezado */
    header {
      padding: 60px 20px 40px;
      text-align: center;
    }
    header h1 {
      font-size: 2.2rem;
      font-weight: 300;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    header p {
      font-size: 0.95rem;
      color: #888888;
      letter-spacing: 1px;
    }

    /* Galería de imágenes en cuadrícula (Grid) */
    .galeria {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      padding: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .foto-item {
      overflow: hidden;
      border-radius: 4px;
      cursor: pointer;
      background-color: #1a1a1a;
      aspect-ratio: 4 / 3;
    }
    .foto-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }
    .foto-item:hover img {
      transform: scale(1.04);
      opacity: 0.9;
    }

    /* Visor a pantalla completa (Modal / Lightbox) */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.92);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal img {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .cerrar-modal {
      position: absolute;
      top: 20px;
      right: 35px;
      color: #fff;
      font-size: 40px;
      font-weight: 300;
      cursor: pointer;
    }

    /* Pie de página y contacto */
    footer {
      padding: 60px 20px;
      text-align: center;
      border-top: 1px solid #222;
      margin-top: 40px;
    }
    footer p {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 12px;
    }
    .contacto-email {
      color: #fff;
      text-decoration: none;
      font-size: 1rem;
      border-bottom: 1px solid #444;
      padding-bottom: 2px;
      transition: border-color 0.3s;
    }
    .contacto-email:hover {
      border-color: #fff;
    }
  </style>
</head>
